# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod Infomation
mod_version=0.2
version_suffix=pre-v
mod_id=villagecraft2essentials
mod_name=VillageCraft 2 Essentials
mod_license=MIT
mod_group_id=com.timeshipmodding.villagecraft2essentials
mod_credits=Made by Timeship Modding
mod_authors=TardisEngineer
mod_description=VillageCraft 2 Essentials is a mod build for the VillageCraft 2 Modpack which is used on the VillageCraft 2 Server, a private youtube SMP. This mod adds custom ores to use as currency, which are copies of diamonds in every way. The other feature added is the ATM, a block which allows you to exchange currencies, including emerald into another currency with set exchange rates. 

# Minecraft Versions
minecraft_version = 1.20.1
minecraft_version_range=[1.20.1,1.21)

# Forge Versions
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)

# Mappings
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

# JEI Dependency Version
jei_version=15.2.0.22




